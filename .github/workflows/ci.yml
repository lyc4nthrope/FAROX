name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check-scope
      # Las alertas high actuales son de devDependencies (vite/vitest/eslint).
      # El bundle de producción no tiene vulnerabilidades high; auditar solo
      # producción evita bloquear el deploy por el toolchain de desarrollo.
      - run: npm audit --omit=dev --audit-level=high
