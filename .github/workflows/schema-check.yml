# F3.1 · DEV-08 — schema-check en stack fresco (CI-only: sin Docker local).
# Host: workflow SEPARADO de ci.yml; job id = `schema-check` (check requerido).
# Sin secrets ⇒ ejecutable en pull_request de forks sin exponer nada.
#
# QUÉ VERIFICA (2026-11-12): `supabase db start` aplica TODAS las migraciones
# en un Postgres limpio y el job exige evidencia de cada archivo. La
# verificación 0012 es histórica (0009-0012): sus fixtures H3 no conocen
# store_distributors ni el alcance actual de pedidos, así que NO se re-ejecuta
# contra el esquema de 51 migraciones. El lint de plpgsql_check sigue cubriendo
# la superficie propia de la app (PostGIS se excluye porque vive en `public`).

name: Schema Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # El config.toml usa claves de CLI v3 (local_smtp, oauth_server, orioledb_version);
          # "latest" resolvía a una v2 que las rechaza. Fijar la misma versión que el repo.
          version: 3.1.0

      - name: "supabase init — gap de config.toml (#506); condicional por T4.2 (se commitea después)"
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          test -f supabase/config.toml || { echo "::error::supabase/config.toml ausente tras init — schema-check no puede correr"; exit 1; }

      - name: "DEV-08: db start AS-IS (sin db reset), captura stdout+stderr"
        run: |
          set -euo pipefail
          supabase db start 2>&1 | tee db-start.log

      - name: "Presencia — todas las migraciones aplicadas en el stack fresco"
        run: |
          set -euo pipefail
          missing=0
          total=0
          for file in supabase/migrations/*.sql; do
            version="$(basename "$file" | cut -d_ -f1)"
            total=$((total + 1))
            if ! grep -q "$version" db-start.log; then
              echo "::error::sin evidencia de la migración $version en db-start.log"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "presencia OK — $total migraciones evidenciadas en db-start.log"

      - name: "supabase db lint — solo superficie de la app (PostGIS excluida: extensión en public, 0001:9)"
        run: |
          set -euo pipefail
          # plpgsql_check lintea TODAS las funciones de `public`, y PostGIS vive ahí:
          # sus funciones reportan errores y warnings propios que no son código de la app.
          # Se derivan de pg_depend las funciones de extensión y se excluyen; el resto sí falla.
          command -v psql >/dev/null 2>&1 || { echo "::error::psql ausente en el runner — no se puede derivar la superficie de extensiones (fail-closed)"; exit 1; }
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "
            SELECT DISTINCT p.proname
            FROM pg_proc p
            JOIN pg_depend d ON d.objid = p.oid AND d.deptype = 'e'
            JOIN pg_extension e ON e.oid = d.refobjid
            WHERE e.extname = 'postgis'
          " > extension-functions.txt
          test -s extension-functions.txt || { echo "::error::lista de funciones de PostGIS vacía — fail-closed (¿cambió el nombre de la extensión?)"; exit 1; }
          supabase db lint --level=warning > db-lint.json
          node scripts/check-db-lint.mjs db-lint.json extension-functions.txt
