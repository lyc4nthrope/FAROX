# F3.2 · DEV-10, DEV-11, DEV-12 — backup semanal off-DB + drill en el MISMO run (design D4, §2.7).
# Batch B2 del cambio devops-ci-cd (sdd-apply).
# Secrets: el Environment `backup` lleva su PROPIA copia de los 3 (design D2), referenciados con
# los nombres del spec DEV-07/T4.1; si faltan, el job FALLA ACÁ con mensaje explícito que nombra
# cada faltante (design §4 fila 1: jamás skip silencioso ni verde fantasma).
# Sin required reviewers en `backup` (D2): el RPO 7d no puede esperar aprobación a las 06:00.
# El artifact se sube ANTES del drill (design §4 fila 6) — un drill rojo conserva el dump candidato.

name: Backup Weekly

on:
  schedule:
    - cron: "0 6 * * 1"  # lunes 06:00 UTC — semanal, RPO 7d (proposal/design §2.7; ajustable)
  workflow_dispatch:      # DEV-10: camino de recuperación manual bajo demanda

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: backup
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        # U5 (design #507 §1): sin input de versión — nombre del input UNVERIFIED ("default latest first").

      - name: "Fail-fast de secretos (DEV-07 · design §4 fila 1 — nunca skip silencioso)"
        run: node scripts/assert-env.mjs SUPABASE_ACCESS_TOKEN PRODUCTION_DB_PASSWORD PRODUCTION_PROJECT_ID

      - name: "supabase init — gap de config.toml (#506); condicional por T4.2"
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          test -f supabase/config.toml || { echo "::error::supabase/config.toml ausente tras init — backup no puede correr (design §2.4 P6)"; exit 1; }

      - name: "supabase link --project-ref (non-interactive vía SUPABASE_DB_PASSWORD, #496)"
        run: |
          set -euo pipefail
          supabase link --project-ref "$PRODUCTION_PROJECT_ID"

      - name: "Dumps pg_dump (DEV-10): schema + data-only — el dump default NO trae data (docs db-dump)"
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p backups
          supabase db dump --linked -f "backups/schema-$TS.sql"
          supabase db dump --linked --data-only -f "backups/data-$TS.sql"
          # Presencia + tamaño (D7 · design §4 fila 6): vacío o ausente ⇒ rojo, nunca backup verde sin bytes.
          test -s "backups/schema-$TS.sql" || { echo "::error::dump de esquema ausente o vacío (backups/schema-$TS.sql) — backup inválido (DEV-10)"; exit 1; }
          test -s "backups/data-$TS.sql" || { echo "::error::dump de datos ausente o vacío (backups/data-$TS.sql) — backup inválido (DEV-10)"; exit 1; }
          {
            echo "TS=$TS"
            echo "SCHEMA_DUMP=backups/schema-$TS.sql"
            echo "DATA_DUMP=backups/data-$TS.sql"
          } >> "$GITHUB_ENV"
          echo "dumps OK — schema: $(wc -c < "backups/schema-$TS.sql") B · data: $(wc -c < "backups/data-$TS.sql") B"

      - name: "Artifact off-DB, retention 30d (DEV-11) — ANTES del drill (design §4 fila 6)"
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.TS }}
          path: |
            ${{ env.SCHEMA_DUMP }}
            ${{ env.DATA_DUMP }}
          retention-days: 30
          if-no-files-found: error

      - name: "Drill de restore en el mismo run (DEV-12): 0008+0012 sobre la BD restaurada"
        run: |
          set -euo pipefail
          # U-leftover design §10 ("confirm at implementation"): semántica de --from-backup con un
          # dump de solo esquema. Flag doc-verified como "path to a logical backup file" (docs db-start);
          # si esta versión del CLI lo rechaza, el job queda ROJO acá — señal diseñada, no silencio.
          supabase db start --from-backup "$SCHEMA_DUMP"
          command -v psql >/dev/null 2>&1 || { echo "::error::psql no disponible en el runner — instalar postgresql-client para el drill (DEV-12)"; exit 1; }
          # URL local default documentada (docs CLI → supabase status → "DB URL").
          LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          # El dump de esquema EXCLUYE auth/storage (docs db-dump) ⇒ la FK public.users → auth.users
          # (20261015000002_tables_reused.sql:72) no tendría filas target. replica-role = protocolo
          # estándar de restore lógico: no dispara triggers (evita duplicar audit) y conserva las
          # constraints VALIDADAS — solo suprime el disparo de FK durante la carga.
          {
            echo "SET session_replication_role = replica;"
            cat "$DATA_DUMP"
            echo "SET session_replication_role = DEFAULT;"
          } | psql -v ON_ERROR_STOP=1 -q "$LOCAL_DB_URL"
          {
            echo "### drill: 0008 sobre BD restaurada"
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015000008_verify.sql "$LOCAL_DB_URL"
            echo "### drill: 0012 sobre BD restaurada"
            psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016000012_verify_hardening.sql "$LOCAL_DB_URL"
          } 2>&1 | tee drill-verify.log
          node scripts/parse-verify-output.mjs --expect=verify drill-verify.log
